name: Solicitar acesso
description: Já paguei o Pix e quero acesso ao bot
title: "Acesso: "
labels: ["acesso"]
body:
  - type: markdown
    attributes:
      value: |
        Esta página é **pública**: não cole o comprovante, CPF nem dados pessoais aqui.
        Só o seu usuário do GitHub e os 6 últimos caracteres do código da transação.
  - type: input
    id: github
    attributes:
      label: Seu usuário do GitHub
      placeholder: ex.: fulano123
    validations:
      required: true
  - type: input
    id: pix
    attributes:
      label: 6 últimos caracteres do código da transação do Pix
      description: Fica no comprovante do seu banco ("ID da transação" ou "E2E").
      placeholder: ex.: A1B2C3
    validations:
      required: true
