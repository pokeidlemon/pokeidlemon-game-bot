name: Solicitar acesso
description: Já paguei o Pix e não recebi o link de download
title: "Download: "
labels: ["acesso"]
body:
  - type: markdown
    attributes:
      value: |
        Esta página é **pública**: não cole o comprovante, o e-mail, o CPF nem outros dados pessoais aqui.
        Só os 6 últimos caracteres do código da transação. O link de download é reenviado para o
        e-mail que você usou na compra.
  - type: input
    id: pix
    attributes:
      label: 6 últimos caracteres do código da transação do Pix
      description: Fica no comprovante do seu banco ("ID da transação" ou "E2E").
      placeholder: ex.: A1B2C3
    validations:
      required: true
